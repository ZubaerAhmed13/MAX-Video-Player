[versions]
agp = "9.4.0"
kotlin = "2.3.21"
ksp = "2.3.7"
composeBom = "2026.08.00"
activity = "1.13.0"
lifecycle = "2.11.0"
navigation = "2.10.0"
media3 = "1.11.0"
room = "2.8.4"
coreKtx = "1.17.0"
coroutines = "1.10.2"
material = "1.13.0"
junit4 = "4.13.2"
