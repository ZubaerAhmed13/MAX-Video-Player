name: Android CI

on:
  push:
    branches: [ main, step-1-professional-foundation, step-2-professional-media-library, step-5-professional-audio-engine, step-6-professional-decoder-engine ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Debug build and unit tests
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Release compilation
        run: gradle --no-daemon :app:assembleRelease
      - name: Lint
        run: gradle --no-daemon :app:lintDebug
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/lint-results-debug.*
            app/build/intermediates/lint_intermediate_text_report/**

  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available on this runner; emulator runner will use its supported fallback."
          fi
      - name: Run API 35 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.zubaer.maxvideoplayer.playback.Step6CodecCapabilityReportTest com.zubaer.maxvideoplayer.test/androidx.test.runner.AndroidJUnitRunner > /tmp/step6-capability-test.txt
            cat /tmp/step6-capability-test.txt
            grep -q 'OK (1 test)' /tmp/step6-capability-test.txt
            mkdir -p app/build/reports/step6
            adb exec-out run-as com.zubaer.maxvideoplayer cat files/step6-decoder-capability-report.txt > app/build/reports/step6/decoder-capability-report-api35.txt
            test -s app/build/reports/step6/decoder-capability-report-api35.txt
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/reports/step6/**

  network-protocol-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Provision deterministic SMB, FTP, explicit FTPS and authenticated RTSP servers
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y samba python3-pyftpdlib python3-openssl ffmpeg netcat-openbsd
          sudo mkdir -p /tmp/max-video-step7/বাংলা-日本語
          sudo cp app/src/androidTest/assets/step5_multi_audio.mp4 /tmp/max-video-step7/step5_multi_audio.mp4
          sudo truncate -s 3221225473 /tmp/max-video-step7/sparse-large.bin
          printf 'Z' | sudo dd of=/tmp/max-video-step7/sparse-large.bin bs=1 seek=3221225472 conv=notrunc status=none
          sudo chmod -R a+rX /tmp/max-video-step7
          sudo useradd --system --no-create-home --shell /usr/sbin/nologin maxci
          printf 'max-network-ci\nmax-network-ci\n' | sudo smbpasswd -s -a maxci
          sudo systemctl stop smbd.service nmbd.service
          sudo smbd --configfile="$PWD/ci/step7/smb.conf" --daemon
          RUNNER_TRACKING_ID='' nohup python3 -m pyftpdlib -p 2121 -w -u maxci -P max-network-ci -d /tmp/max-video-step7 > /tmp/max-video-step7-ftp.log 2>&1 &
          cp ci/step7/ftps_server.pem /tmp/max-video-step7-ftps-server.pem
          cp ci/step7/ftps_server.key /tmp/max-video-step7-ftps-server.key
          chmod 600 /tmp/max-video-step7-ftps-server.key
          RUNNER_TRACKING_ID='' nohup python3 ci/step7/ftps_server.py > /tmp/max-video-step7-ftps.log 2>&1 &
          docker run --detach --name max-video-step7-rtsp --publish 8554:8554 --volume "$PWD/ci/step7/mediamtx.yml:/mediamtx.yml:ro" bluenviron/mediamtx:1.21.0@sha256:19fddade8d6110a3d718ac0045681fbeba344ae563a066205fe5929a87f7582f
          timeout 30 bash -c 'until nc -z 127.0.0.1 8554; do sleep 1; done'
          RUNNER_TRACKING_ID='' nohup ffmpeg -nostdin -loglevel warning -re -f lavfi -i 'testsrc2=size=160x90:rate=15' -re -f lavfi -i 'sine=frequency=880:sample_rate=48000' -c:v libx264 -preset ultrafast -tune zerolatency -profile:v baseline -pix_fmt yuv420p -g 30 -keyint_min 30 -sc_threshold 0 -c:a aac -b:a 64k -ar 48000 -ac 1 -f rtsp -rtsp_transport tcp rtsp://maxci:max-network-ci@127.0.0.1:8554/step7 > /tmp/max-video-step7-ffmpeg.log 2>&1 &
          for port in 1445 2121 2122; do
            timeout 30 bash -c "until nc -z 127.0.0.1 $port; do sleep 1; done" || {
              cat /tmp/max-video-step7-ftps.log
              exit 1
            }
          done
          timeout 30 bash -c 'until ffprobe -v error -rtsp_transport tcp -show_streams rtsp://maxci:max-network-ci@127.0.0.1:8554/step7 >/dev/null 2>&1; do sleep 1; done' || { docker logs max-video-step7-rtsp; cat /tmp/max-video-step7-ffmpeg.log; exit 1; }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available on this runner; emulator runner will use its supported fallback."
          fi
      - name: Certify real SMB, FTP, explicit FTPS and authenticated RTSP playback on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.zubaer.maxvideoplayer.playback.Step7ProtocolServerIntegrationTest -Pandroid.testInstrumentationRunnerArguments.step7ProtocolServers=true -Pandroid.testInstrumentationRunnerArguments.step7ServerHost=10.0.2.2
      - name: Capture RTSP server log
        if: always()
        shell: bash
        run: docker logs max-video-step7-rtsp > /tmp/max-video-step7-rtsp.log 2>&1 || true
      - name: Upload network protocol reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-protocol-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            /tmp/max-video-step7-samba.log
            /tmp/max-video-step7-ftp.log
            /tmp/max-video-step7-ftps.log
            /tmp/max-video-step7-ffmpeg.log
            /tmp/max-video-step7-rtsp.log

  legacy-thumbnail-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 28]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "/dev/kvm is not available on this runner; emulator runner will use its supported fallback."
          fi
      - name: Run legacy thumbnail instrumentation on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: >-
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=com.zubaer.maxvideoplayer.feature.library.ThumbnailRepositoryInstrumentedTest
      - name: Upload legacy thumbnail reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-thumbnail-reports-api-${{ matrix.api-level }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
