[global]
   server role = standalone server
   workgroup = WORKGROUP
   security = user
   map to guest = Never
   server min protocol = SMB2_02
   server max protocol = SMB3_11
   server signing = mandatory
   smb ports = 1445
   disable netbios = yes
   load printers = no
   printing = bsd
   printcap name = /dev/null
   log file = /tmp/max-video-step7-samba.log
   max log size = 1000

[media]
   path = /tmp/max-video-step7
   browseable = yes
   read only = yes
   guest ok = no
   valid users = maxci
